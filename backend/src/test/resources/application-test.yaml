spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

  mail:
    host: localhost
    port: 25
    username: test
    password: test

server:
  port: 0

sms:
  fast2sms:
    api-key: test-key
    sender-id: TESTSMS
    route: q

jwt:
  secret: test-secret-key-must-be-at-least-32-characters-long-for-hmac
  access-ttl-seconds: 1800

logging:
  level:
    com.neobank: DEBUG
