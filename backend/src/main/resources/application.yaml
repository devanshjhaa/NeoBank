spring:
  application:
    name: neobank-wallet

  datasource:
    url: jdbc:postgresql://localhost:5433/neobank?options=-c%20TimeZone=UTC
    username: neobank
    password: neobank
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000

server:
  port: 8081
  shutdown: graceful
  servlet:
    context-path: /api/v1

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

spring.mail:
  host: smtp.resend.com
  port: 465
  username: resend
  password: ${RESEND_API_KEY:no-key-set}
  properties:
    mail.smtp.auth: true
    mail.smtp.ssl.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /docs/api
  swagger-ui:
    path: /docs/swagger

logging:
  level:
    com.neobank: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

sms:
  fast2sms:
    api-key: ${FAST2SMS_API_KEY:no-key-set}
    sender-id: FSTSMS
    route: q

jwt:
  secret: ${JWT_SECRET:neobank-dev-secret-key-change-in-production-must-be-at-least-32-chars}
  access-ttl-seconds: 1800

google:
  client-id: ${GOOGLE_CLIENT_ID:no-client-id-set}
