spring:
  datasource:
    url: jdbc:tc:postgresql:16:///neobank_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 0

logging:
  level:
    com.neobank: DEBUG
